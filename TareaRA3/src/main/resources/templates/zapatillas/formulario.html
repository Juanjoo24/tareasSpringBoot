<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Formulario de Zapatillas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

    <div class="card">
        <div class="card-header bg-primary text-white">
            <h2 th:text="${zapatilla.id == null} ? 'Añadir Nueva Zapatilla' : 'Editar Zapatilla'"></h2>
        </div>
        <div class="card-body">
            <form th:action="@{/zapatillas/guardar}" th:object="${zapatilla}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="mb-3">
                    <label class="form-label">Marca:</label>
                    <input type="text" th:field="*{marca}" class="form-control" required />
                </div>

                <div class="mb-3">
                    <label class="form-label">Modelo:</label>
                    <input type="text" th:field="*{modelo}" class="form-control" required />
                </div>

                <div class="mb-3">
                    <label class="form-label">Talla:</label>
                    <input type="number" th:field="*{talla}" class="form-control" required />
                </div>

                <div class="mb-3">
                    <label class="form-label">Precio (€):</label>
                    <input type="number" step="0.01" th:field="*{precio}" class="form-control" required />
                </div>

                <button type="submit" class="btn btn-success">Guardar Zapatilla</button>
                <a th:href="@{/zapatillas}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>

</body>
</html>
