<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Inventario de Zapatillas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Listado de Zapatillas</h2>
        <a th:href="@{/zapatillas/nuevo}" class="btn btn-primary">Añadir Nueva Zapatilla</a>
    </div>

    <table class="table table-hover shadow-sm">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Marca</th>
                <th>Modelo</th>
                <th>Talla</th>
                <th>Precio</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="zapa : ${listaZapatillas}">
                <td th:text="${zapa.id}"></td>
                <td th:text="${zapa.marca}"></td>
                <td th:text="${zapa.modelo}"></td>
                <td th:text="${zapa.talla}"></td>
                <td th:text="${zapa.precio} + ' €'"></td>
                <td>
                    <a th:href="@{/zapatillas/editar/{id}(id=${zapa.id})}" class="btn btn-warning btn-sm">Editar</a>
                    <a th:href="@{/zapatillas/eliminar/{id}(id=${zapa.id})}" class="btn btn-danger btn-sm" 
                       onclick="return confirm('¿Seguro que quieres eliminarla?')">Borrar</a>
                </td>
            </tr>
        </tbody>
    </table>

    <div th:if="${listaZapatillas.isEmpty()}" class="alert alert-info">
        No hay zapatillas en el inventario. ¡Añade la primera!
    </div>
</body>
</html>
